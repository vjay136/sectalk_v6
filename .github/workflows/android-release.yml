name: SecTalk Android builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-release.yml'
  push:
    branches: [main, codex/v6-android-free]
    tags: ['android-v*']
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Verify Android SDK on the runner
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Validate Android release tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'/\1/p" app/build.gradle)
          test -n "$VERSION"
          test "$TAG" = "android-v$VERSION"
      - name: Test and build Android packages
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Verify build outputs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -Fq 'jar is unsigned.'
      - uses: actions/upload-artifact@v4
        with:
          name: sectalk-android-${{ github.run_number }}
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
            apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Enable KVM for the Android emulator
        if: github.ref == 'refs/heads/codex/v6-android-free' || startsWith(github.ref, 'refs/tags/android-v')
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
      - name: Select the APK to render
        if: github.ref == 'refs/heads/codex/v6-android-free' || startsWith(github.ref, 'refs/tags/android-v')
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo 'SECTALK_EMULATOR_APK=app/build/outputs/apk/debug/app-debug.apk' >> "$GITHUB_ENV"
            echo 'SECTALK_EMULATOR_MODE=debug' >> "$GITHUB_ENV"
            exit 0
          fi
          version=$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'/\1/p" app/build.gradle)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-free\.[0-9]+$ ]]
          apk=app/build/outputs/apk/sectalk-owner-signed.apk
          release="https://github.com/$GITHUB_REPOSITORY/releases/download/android-v$version"
          curl --fail --location --proto '=https' --retry 10 --retry-all-errors --retry-delay 5 --max-time 60 \
            "$release/sectalk-android-$version-signed.apk" -o "$apk"
          signed_sha=$(curl --fail --location --proto '=https' --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 \
            "$release/sectalk-android-$version-signed.apk.sha256" | cut -d ' ' -f 1)
          [[ "$signed_sha" =~ ^[0-9a-fA-F]{64}$ ]]
          printf '%s  %s\n' "$signed_sha" "$apk" | sha256sum --check
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          echo "SECTALK_EMULATOR_APK=$apk" >> "$GITHUB_ENV"
          echo 'SECTALK_EMULATOR_MODE=signed' >> "$GITHUB_ENV"
      - name: Render the APK on Android
        if: github.ref == 'refs/heads/codex/v6-android-free' || startsWith(github.ref, 'refs/tags/android-v')
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 240
          disable-linux-hw-accel: false
          working-directory: apps/android
          script: bash smoke-render.sh "$SECTALK_EMULATOR_APK" app/build/outputs/render-smoke "$SECTALK_EMULATOR_MODE"
      - name: Upload Android render evidence
        if: always() && (github.ref == 'refs/heads/codex/v6-android-free' || startsWith(github.ref, 'refs/tags/android-v'))
        uses: actions/upload-artifact@v4
        with:
          name: sectalk-android-render-${{ github.run_number }}
          path: apps/android/app/build/outputs/render-smoke/
          if-no-files-found: ignore
