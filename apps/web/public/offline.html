<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1423">
    <title>SecTalk is offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b1423; color: #eff7ff; }
      body { min-height: 95vh; display: grid; place-items: center; margin: 0; }
      main { width: min(100% - 3rem, 34rem); padding: 1rem; box-sizing: border-box; }
      a { display: inline-block; padding: .65rem 1rem; color: #091221; background: #66e0ff; border-radius: .5rem; }
      a:focus-visible { outline: 2px solid #eff7ff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>SecTalk is offline</h1>
      <p>Reconnect to open your conversations and call history.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
